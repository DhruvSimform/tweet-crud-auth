{% extends "layout.html" %}

{% block title %}Chai aur Tweet{% endblock title %}

{% block content %}

<div class="container mx-auto px-4 py-6">
    
    <!-- Create Tweet Button -->
    <div id="tweetButtonContainer" class="flex justify-center mb-6 transition-all duration-300">
        <a id="tweetButton" class="text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800 shadow-lg" 
           href="{% url 'tweet_create' %}">
            + Create a Tweet
        </a>
    </div>

    <!-- Tweets Grid -->
    <div id="tweet-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

</div>

{% endblock content %}
{% block script %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        console.log("DOM fully loaded and parsed");

        var tweets = {{ tweets_json|safe }};
        console.log("Loaded Tweets:", tweets);

        const tweetContainer = document.getElementById('tweet-container');
        if (!tweetContainer) {
            console.error("Tweet container not found!");
            return;
        }

        function renderTweets() {
            tweetContainer.innerHTML = ""; // Clear previous content

            tweets.forEach(tweet => {
                const tweetCard = document.createElement('div');
                tweetCard.className = "max-w-sm bg-white border border-gray-200 rounded-lg shadow-md dark:bg-gray-800 dark:border-gray-700 overflow-hidden";

                let photoHTML = tweet.photo ? `<img class="w-full h-48 object-cover" src="${tweet.photo}" alt="Tweet Image" />` : '';

                tweetCard.innerHTML = `
                    ${photoHTML}
                    <div class="p-5">
                        <h5 class="mb-2 text-xl font-semibold text-gray-900 dark:text-white">@${tweet.user}</h5>
                        <p class="mb-3 text-gray-700 dark:text-gray-400">${tweet.text || "No content available"}</p>
                    </div>
                `;

                tweetContainer.appendChild(tweetCard);
            });
        }

        renderTweets();  // Call function to load tweets
    });
</script>
{% endblock script %}
