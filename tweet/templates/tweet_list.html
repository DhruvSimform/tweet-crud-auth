{% extends "layout.html" %}

{% block title %}Chai aur Tweet{% endblock title %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    


    <!-- Tweets Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="tweetContainer">
        {% for tweet in tweets %}
        <div class="tweet-card max-w-sm bg-white border border-gray-200 rounded-lg shadow-md p-4" data-id="{{ tweet.id }}">
            {% if tweet.photo %}
            <img class="w-full h-48 object-cover" src="{{ tweet.photo.url }}" alt="Tweet Image">
            {% endif %}
            <h5 class="text-xl font-semibold">{{ tweet.user.username }}</h5>
            <p class="text-gray-700">{{ tweet.text }}</p>
        </div>
        {% endfor %}
    </div>

    <!-- Loader -->
    <div id="loading" class="text-center text-gray-500 mt-4 hidden">Loading...</div>
</div>
{% endblock content %}

{% block script %}
<script>
    let page = 2; // Start from second page
    let isLoading = false;
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param) || ''; // Return the parameter value or empty string
    }
    async function loadMoreTweets() {
        if (isLoading) return;
        isLoading = true;
        document.getElementById("loading").classList.remove("hidden");

        try {
            // Get the 'q' parameter from the URL
            const query = getQueryParam('q');

            // Fetch tweets with pagination while preserving search query
            const response = await fetch(`?page=${page}&q=${encodeURIComponent(query)}`, {
                headers: { "X-Requested-With": "XMLHttpRequest" }
            });
            const data = await response.json();

            if (data.tweets.length > 0) {
                data.tweets.forEach(tweet => addTweetToDOM(tweet));
                page++;
            } else {
                window.removeEventListener("scroll", handleScroll);
            }
        } catch (error) {
            console.error("Error loading tweets:", error);
        }

        document.getElementById("loading").classList.add("hidden");
        isLoading = false;
    }

    function handleScroll() {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
            loadMoreTweets();
        }
    }

    async function createTweet() {
        let text = document.getElementById("tweetText").value;
       
    }

    function addTweetToDOM(tweet, prepend = false) {
        let tweetCard = `
            <div class="tweet-card max-w-sm bg-white border border-gray-200 rounded-lg shadow-md p-4" data-id="${tweet.id}">
                ${tweet.photo ? `<img class="w-full h-48 object-cover" src="${tweet.photo}" alt="Tweet Image">` : ""}
                <h5 class="text-xl font-semibold">${tweet.username}</h5>
                <p class="text-gray-700">${tweet.text}</p>
            </div>`;

        let container = document.getElementById("tweetContainer");
        if (prepend) {
            container.insertAdjacentHTML("afterbegin", tweetCard);
        } else {
            container.insertAdjacentHTML("beforeend", tweetCard);
        }
    }

    window.addEventListener("scroll", handleScroll);
</script>
{% endblock script %}
